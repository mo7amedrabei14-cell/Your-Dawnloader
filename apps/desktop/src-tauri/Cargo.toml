[workspace]

[package]
name = "your-dawnloader-desktop"
version = "0.1.0"
description = "Your Dawnloader desktop application"
authors = ["Your Dawnloader contributors"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "your_dawnloader_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
dawn-domain = { path = "../../../crates/domain" }
dawn-detection = { path = "../../../crates/detection" }
dawn-security = { path = "../../../crates/security" }
dawn-downloader = { path = "../../../crates/downloader" }
dawn-local-storage = { path = "../../../crates/local-storage" }
dawn-api-contract = { path = "../../../crates/api-contract" }
keyring.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2" }
tauri-plugin-opener = "2.7.2"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
